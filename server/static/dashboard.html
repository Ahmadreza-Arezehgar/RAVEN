<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVEN — Live Stats</title>
    <meta name="description" content="Live user count dashboard for RAVEN messenger">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(20, 20, 35, 0.6);
            --border-card: rgba(120, 80, 255, 0.15);
            --accent-purple: #7c3aed;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --text-primary: #f0f0f5;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --glow-purple: rgba(124, 58, 237, 0.3);
            --glow-green: rgba(16, 185, 129, 0.4);
            --glow-blue: rgba(59, 130, 246, 0.3);
            --glow-amber: rgba(245, 158, 11, 0.3);
            --glow-cyan: rgba(6, 182, 212, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(59, 130, 246, 0.04) 0%, transparent 60%);
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }

            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-purple);
            border-radius: 50%;
            opacity: 0;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 50px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
            gap: 36px;
        }

        /* Brand */
        .brand {
            text-align: center;
        }

        .brand-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            box-shadow: 0 8px 32px var(--glow-purple);
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% {
                box-shadow: 0 8px 32px var(--glow-purple);
            }

            100% {
                box-shadow: 0 12px 48px rgba(124, 58, 237, 0.5);
            }
        }

        .brand h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 6px;
        }

        /* ── Hero stats (big cards) ── */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            width: 100%;
            max-width: 700px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(124, 58, 237, 0.5) 50%, transparent 100%);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.1);
        }

        .stat-card.green::before {
            background: linear-gradient(90deg, transparent 0%, var(--glow-green) 50%, transparent 100%);
        }

        .stat-card.green:hover {
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.1);
        }

        .stat-card.blue::before {
            background: linear-gradient(90deg, transparent 0%, var(--glow-blue) 50%, transparent 100%);
        }

        .stat-card.blue:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.1);
        }

        .stat-card.amber::before {
            background: linear-gradient(90deg, transparent 0%, var(--glow-amber) 50%, transparent 100%);
        }

        .stat-card.amber:hover {
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: 0 20px 60px rgba(245, 158, 11, 0.1);
        }

        .stat-card.cyan::before {
            background: linear-gradient(90deg, transparent 0%, var(--glow-cyan) 50%, transparent 100%);
        }

        .stat-card.cyan:hover {
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 20px 60px rgba(6, 182, 212, 0.1);
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .stat-number {
            font-size: 64px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #fff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.3s ease;
        }

        .stat-number.updated {
            animation: numberPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes numberPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        .green .stat-number {
            background: linear-gradient(135deg, #6ee7b7, var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            justify-content: center;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            position: relative;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0;
                transform: scale(0.8);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.4);
            }
        }

        .live-text {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-green);
        }

        /* ── Secondary stats row (smaller cards) ── */
        .secondary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            width: 100%;
            max-width: 700px;
        }

        .stat-card.small {
            padding: 24px 20px;
            border-radius: 20px;
        }

        .stat-card.small .stat-number {
            font-size: 36px;
            letter-spacing: -1.5px;
        }

        .stat-card.small .stat-label {
            font-size: 11px;
            margin-bottom: 10px;
        }

        .blue .stat-number {
            background: linear-gradient(135deg, #93c5fd, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .amber .stat-number {
            background: linear-gradient(135deg, #fcd34d, var(--accent-amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cyan .stat-number {
            background: linear-gradient(135deg, #67e8f9, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Status bar ── */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            transition: background 0.3s ease;
        }

        .status-dot.error {
            background: #ef4444;
        }

        .status-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
            font-variant-numeric: tabular-nums;
        }

        .loading .stat-number {
            animation: shimmer 1.5s ease-in-out infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.7;
            }
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .footer a {
            color: var(--accent-purple);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #a78bfa;
        }

        @media (max-width: 700px) {
            .hero-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .secondary-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .stat-number {
                font-size: 48px !important;
                letter-spacing: -2px !important;
            }

            .brand h1 {
                font-size: 32px;
            }

            .stat-card {
                padding: 28px 20px;
            }

            .stat-card.small {
                padding: 20px 16px;
            }

            .container {
                padding: 32px 16px;
                gap: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="brand">
            <div class="brand-icon">🐦‍⬛</div>
            <h1>RAVEN</h1>
            <p>Live Platform Statistics</p>
        </div>

        <!-- Hero: big 2-column -->
        <div class="hero-grid">
            <div class="stat-card loading" id="totalCard">
                <div class="stat-icon">👥</div>
                <div class="stat-label">Registered Accounts</div>
                <div class="stat-number" id="totalUsers">—</div>
                <div class="live-indicator">
                    <div class="pulse-dot"></div>
                    <span class="live-text">Database</span>
                </div>
            </div>

            <div class="stat-card green loading" id="onlineCard">
                <div class="stat-icon">🟢</div>
                <div class="stat-label">Online Now</div>
                <div class="stat-number" id="onlineUsers">—</div>
                <div class="live-indicator">
                    <div class="pulse-dot"></div>
                    <span class="live-text">Real-time</span>
                </div>
            </div>
        </div>

        <!-- Secondary: 3-column -->
        <div class="secondary-grid">
            <div class="stat-card small blue loading" id="messagesCard">
                <div class="stat-icon">💬</div>
                <div class="stat-label">Total Messages</div>
                <div class="stat-number" id="totalMessages">—</div>
            </div>

            <div class="stat-card small amber loading" id="postsCard">
                <div class="stat-icon">📝</div>
                <div class="stat-label">Total Posts</div>
                <div class="stat-number" id="totalPosts">—</div>
            </div>

            <div class="stat-card small cyan loading" id="newTodayCard">
                <div class="stat-icon">✨</div>
                <div class="stat-label">New Today</div>
                <div class="stat-number" id="newToday">—</div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Connecting...</span>
            <span class="status-time" id="statusTime">—</span>
        </div>

        <div class="footer">
            Powered by <a href="#">RAVEN Messenger</a> — Encrypted & Private
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api/stats/live';
        const POLL_INTERVAL = 5000;

        let prev = {};
        let isLoading = true;

        const els = {
            totalUsers: document.getElementById('totalUsers'),
            onlineUsers: document.getElementById('onlineUsers'),
            totalMessages: document.getElementById('totalMessages'),
            totalPosts: document.getElementById('totalPosts'),
            newToday: document.getElementById('newToday'),
        };
        const cards = {
            totalCard: document.getElementById('totalCard'),
            onlineCard: document.getElementById('onlineCard'),
            messagesCard: document.getElementById('messagesCard'),
            postsCard: document.getElementById('postsCard'),
            newTodayCard: document.getElementById('newTodayCard'),
        };
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusTime = document.getElementById('statusTime');

        // Particles
        (function () {
            const c = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
                const colors = ['var(--accent-purple)', 'var(--accent-blue)', 'var(--accent-cyan)'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.appendChild(p);
            }
        })();

        function animateNumber(el, from, to, duration = 600) {
            if (from === to) return;
            const start = performance.now();
            const diff = to - from;
            function step(now) {
                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);
                const eased = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                el.textContent = Math.round(from + diff * eased).toLocaleString();
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
            el.classList.remove('updated');
            void el.offsetWidth;
            el.classList.add('updated');
        }

        async function fetchStats() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                const vals = {
                    totalUsers: data.total_users || 0,
                    onlineUsers: data.online_users || 0,
                    totalMessages: data.total_messages || 0,
                    totalPosts: data.total_posts || 0,
                    newToday: data.new_users_today || 0,
                };

                if (isLoading) {
                    for (const [key, el] of Object.entries(els)) {
                        el.textContent = vals[key].toLocaleString();
                    }
                    for (const card of Object.values(cards)) {
                        card.classList.remove('loading');
                    }
                    isLoading = false;
                } else {
                    for (const [key, el] of Object.entries(els)) {
                        animateNumber(el, prev[key] ?? 0, vals[key]);
                    }
                }

                prev = vals;

                statusDot.classList.remove('error');
                const source = data.source ? ' (Production)' : '';
                statusText.textContent = `Connected${source} — refreshing every 5s`;
                statusTime.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            } catch (err) {
                console.error('Fetch error:', err);
                statusDot.classList.add('error');
                statusText.textContent = 'Connection lost — retrying...';
            }
        }

        fetchStats();
        setInterval(fetchStats, POLL_INTERVAL);
    </script>
</body>

</html>
