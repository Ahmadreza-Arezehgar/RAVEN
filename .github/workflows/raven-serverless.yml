# Raven serverless node CI — the shipping terminal path only:
# raven-core / ash / raven-node / raven-swarm + protocol vectors on Linux, macOS, Windows.
# Feature-gated lab crypto lives in raven-lab-gates.yml; the legacy iOS/Go
# protocol tests live in raven-ios-protocol.yml so they never block this gate.
name: Raven Serverless Node

on:
  push:
    paths:
      - "node/**"
      - "protocol/**"
      - "shared-vectors/**"
      - "ios-native/RAVEN/Libp2pBridge/**"
      - "ios-native/RAVEN/RAVEN/Core/Config/FeatureFlags.swift"
      - "ios-native/RAVEN/RAVEN/Core/Protocol/**"
      - "ios-native/RAVEN/RAVEN/Core/Mesh/**"
      - "ios-native/RAVEN/RAVEN/Core/Transport/**"
      - "ios-native/RAVEN/RAVEN/Core/Messaging/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/ATSAM/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/LAN/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/MessageContentSealer.swift"
      - "ios-native/RAVEN/RAVEN.xcodeproj/**"
      - "ios-native/RAVEN/RAVEN/App/**"
      - "ios-native/RAVEN/RAVEN/Features/Contacts/**"
      - "ios-native/RAVEN/RAVEN/Features/QRCode/**"
      - "ios-native/RAVEN/RAVEN/Features/Settings/RavenServerlessLanSettingsView.swift"
      - "ios-native/RAVEN/RAVENTests/**"
      - "ios-native/RAVEN/RAVEN/**/*.swift"
      - "RAVEN-WatchApp/RAVEN-Watch/**/*.swift"
      - "node/scripts/ios_lan_kat.sh"
      - "node/scripts/ios_lan_lab_checklist.md"
      - "scripts/secret_history_scan.sh"
      - "docs/MIGRATION_SERVERLESS_V1.md"
      - ".github/workflows/raven-serverless.yml"
  pull_request:
    paths:
      - "node/**"
      - "protocol/**"
      - "shared-vectors/**"
      - "ios-native/RAVEN/Libp2pBridge/**"
      - "ios-native/RAVEN/RAVEN/Core/Config/FeatureFlags.swift"
      - "ios-native/RAVEN/RAVEN/Core/Protocol/**"
      - "ios-native/RAVEN/RAVEN/Core/Mesh/**"
      - "ios-native/RAVEN/RAVEN/Core/Transport/**"
      - "ios-native/RAVEN/RAVEN/Core/Messaging/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/ATSAM/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/LAN/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/MessageContentSealer.swift"
      - "ios-native/RAVEN/RAVEN.xcodeproj/**"
      - "ios-native/RAVEN/RAVEN/App/**"
      - "ios-native/RAVEN/RAVEN/Features/Contacts/**"
      - "ios-native/RAVEN/RAVEN/Features/QRCode/**"
      - "ios-native/RAVEN/RAVEN/Features/Settings/RavenServerlessLanSettingsView.swift"
      - "ios-native/RAVEN/RAVENTests/**"
      - "ios-native/RAVEN/RAVEN/**/*.swift"
      - "RAVEN-WatchApp/RAVEN-Watch/**/*.swift"
      - "node/scripts/ios_lan_kat.sh"
      - "node/scripts/ios_lan_lab_checklist.md"
      - "scripts/secret_history_scan.sh"
      - "docs/MIGRATION_SERVERLESS_V1.md"
      - ".github/workflows/raven-serverless.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raven-serverless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messaging-product-boundary:
    name: Messaging-only product boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Refuse public-social product regressions
        run: bash node/scripts/messaging_product_boundary_gate.sh

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Run secret history scan (CI mode)
        run: bash scripts/secret_history_scan.sh --ci

  rust-linux:
    name: Rust + vectors (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # CI uses isolated temporary profiles. The locked-file backend is
      # explicitly debug/CI-only and Release refuses it. Even in that mode,
      # raven-core proves that no protected identity exists for a fresh profile
      # before generating one, so a reachable org.freedesktop.secrets service is
      # still required (see the "headless Secret Service" step below).
      RAVEN_IDENTITY_BACKEND: locked-file
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Start headless Secret Service (identity-absence proofs, chat-history key)
        # Two raven-core paths need a live org.freedesktop.secrets even in
        # locked-file mode: identity_store::load_seed_with_migrate refuses to
        # generate an identity unless the platform store proves none exists,
        # and chat_history keeps its ChaCha20-Poly1305 key in the *default*
        # Secret Service collection. A hosted runner has no desktop session, so
        # run gnome-keyring on a private session bus with an unlocked login
        # keyring (the PAM-style --login flow is what creates the default
        # collection on gnome-keyring >= 46) and export the bus to later steps.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-bin dbus-daemon gnome-keyring libsecret-tools
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg-runtime}"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address)"
          export DBUS_SESSION_BUS_ADDRESS
          # Throwaway keyring password: the collection lives only for this job.
          printf 'raven-ci-throwaway' | gnome-keyring-daemon --daemonize --login >/dev/null
          gnome-keyring-daemon --start --components=secrets >/dev/null
          # Prove the default collection exists and is writable before any cargo
          # step relies on it (this is exactly what chat_history needs).
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets org.freedesktop.Secret.Service.ReadAlias \
            string:default | grep -q 'collection/login'
          printf 'probe' | secret-tool store --label=raven-ci-probe raven ci-probe
          test "$(secret-tool lookup raven ci-probe)" = probe
          secret-tool clear raven ci-probe
          {
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: node
          # Keep the dependency cache even when a test step fails so a red run
          # does not force the next run to start cold.
          cache-on-failure: true
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: |
          cargo clippy --locked -p raven-core -p ash -p raven-node -p raven-swarm --all-targets -- -D warnings
          cargo clippy --locked -p raven-swarm --all-features --all-targets -- -D warnings
      - name: RustSec active dependency audit
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          python3 -m unittest scripts/test_audit_active_dependencies.py
          python3 scripts/audit_active_dependencies.py
      - name: test raven-core + ash
        run: cargo test --locked -p raven-core -p ash -p raven-node
      - name: LAN handshake KAT (shared vectors, no live network)
        run: cargo test --locked -p raven-core --lib lan_
      - name: LAN direct two-node smoke
        run: ./scripts/lan_direct_two_node.sh
      - name: bridge + fuzz smoke
        run: cargo test --locked -p raven-core --test bridge_v1 --test fuzz_smoke
      - name: 10,000-message queue reliability gate
        run: cargo test --locked -p raven-core --test reliability_10k -- --ignored
      - name: Deterministic 1,000-node adversarial DTN simulation
        run: |
          cargo test --locked -p raven-core --test network_sim_1000
          cargo test --locked --release -p raven-core --test network_sim_1000
      - name: build swarm
        run: cargo build --locked -p raven-swarm -p raven-node
      - name: experimental mailbox/NAT tests (still production-disabled)
        run: |
          set -euo pipefail
          expect_failure_with_message() {
            expected="$1"
            shift
            log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              echo "security hold unexpectedly allowed command: $*" >&2
              rm -f "$log"
              exit 1
            fi
            if ! grep -Fq -- "$expected" "$log"; then
              echo "command failed without the expected security-hold diagnostic: $*" >&2
              tail -n 80 "$log" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          }
          cargo test --locked -p raven-swarm --all-features --all-targets
          cargo build --locked --release -p raven-swarm \
            --features experimental-offline-mailbox \
            --bin raven-swarm-mailbox-experimental
          cargo build --locked --release -p raven-swarm \
            --features experimental-nat-connectivity \
            --bin raven-swarm-connectivity-experimental
          expect_failure_with_message \
            "security hold: pass --allow-experimental-mailbox explicitly" \
            target/release/raven-swarm-mailbox-experimental \
            serve --data-dir target/ci-mailbox-security-hold --timeout-secs 1
          expect_failure_with_message \
            "experimental NAT connectivity requires explicit runtime opt-in" \
            target/release/raven-swarm-connectivity-experimental --run-seconds 1
      - name: release crypto feature gate
        run: |
          set -euo pipefail
          cargo build --locked --release -p raven-core -p raven-node -p ash
          for package in raven-core raven-node ash; do
            log="$(mktemp)"
            if cargo build --locked --release -p "$package" --features unsafe-demo-crypto >"$log" 2>&1; then
              echo "unsafe-demo-crypto unexpectedly linked into $package release" >&2
              rm -f "$log"
              exit 1
            fi
            if ! grep -Fq -- \
              "unsafe-demo-crypto is forbidden in release builds" "$log"; then
              echo "unsafe-demo-crypto gate for $package failed for an unrelated reason" >&2
              tail -n 80 "$log" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          done
      - name: libp2p swarm smoke
        run: ./scripts/libp2p_swarm_smoke.sh
      - name: bootstrap manual-peer smoke
        run: ./scripts/bootstrap_manual_peer_smoke.sh
      - name: mailbox opaque put/get smoke
        run: ./scripts/mailbox_opaque_smoke.sh
      - name: libp2p offline mailbox restart smoke
        run: ./scripts/swarm_mailbox_smoke.sh
      - name: legacy Internet path remains fail-closed
        run: ./scripts/internet_dial_smoke.sh
      - name: protocol vectors (python)
        working-directory: protocol/reference
        run: |
          python3 -m pip install -q -r requirements.txt
          python3 -m pytest -q
          python3 generate_rvn1.py
          git diff --exit-code -- ../../shared-vectors/rvn1
          test -z "$(git ls-files --others --exclude-standard -- ../../shared-vectors/rvn1)"
      - name: SBOM (cargo tree --locked + cyclonedx if available)
        run: |
          set -euo pipefail
          mkdir -p target/sbom
          cargo tree --locked -p raven-core -p ash -p raven-node -p raven-swarm --prefix depth \
            > target/sbom/raven-cargo-tree.txt
          if cargo install --list 2>/dev/null | grep -q '^cargo-cyclonedx '; then
            cargo cyclonedx -p raven-core --format json --output-cdx target/sbom/raven-core.cdx.json || true
          else
            cargo install cargo-cyclonedx --locked --version 0.5.7 || true
            cargo cyclonedx -p raven-core --format json --output-cdx target/sbom/raven-core.cdx.json \
              || echo "cyclonedx optional — cargo-tree SBOM retained"
          fi
          test -s target/sbom/raven-cargo-tree.txt
          ls -la target/sbom/
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raven-sbom-linux
          path: node/target/sbom/
          if-no-files-found: error

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: node
          # Keep the dependency cache even when a test step fails so a red run
          # does not force the next run to start cold.
          cache-on-failure: true
      - name: test raven-core + ash + swarm build
        run: |
          cargo test --locked -p raven-core -p ash -p raven-node
          cargo test --locked -p raven-core --lib lan_
          cargo build --locked -p raven-swarm -p raven-node
          cargo build --locked --release -p raven-core -p raven-node -p ash
      - name: libp2p swarm smoke
        run: ./scripts/libp2p_swarm_smoke.sh
      - name: bootstrap manual-peer smoke
        run: ./scripts/bootstrap_manual_peer_smoke.sh

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: node
          # Keep the dependency cache even when a test step fails so a red run
          # does not force the next run to start cold.
          cache-on-failure: true
      - name: test raven-core + ash (no bash smoke scripts)
        run: |
          cargo test --locked -p raven-core -p ash -p raven-node
          cargo build --locked -p raven-node -p raven-swarm
          cargo build --locked --release -p raven-core -p raven-node -p ash
      - name: PowerShell install script syntax check
        shell: pwsh
        run: |
          Get-Command Get-Content | Out-Null
          $p = "scripts/install/windows_service.ps1"
          if (-not (Test-Path $p)) { throw "missing $p" }
          # Parse-only: ensure script is well-formed PowerShell
          $tokens = $null
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $p), [ref]$tokens, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_ }; throw "parse errors" }
          Write-Host "windows_service.ps1 OK"
      # bash libp2p/bootstrap smokes are Linux/macOS-only on this workflow.
