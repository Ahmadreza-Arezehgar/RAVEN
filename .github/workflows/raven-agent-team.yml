name: Raven A2A Agent Team

on:
  push:
    paths:
      - "agent_team/**"
      - "protocol/reference/**"
      - ".github/workflows/raven-agent-team.yml"
  pull_request:
    paths:
      - "agent_team/**"
      - "protocol/reference/**"
      - ".github/workflows/raven-agent-team.yml"
  workflow_dispatch:

concurrency:
  group: raven-agent-team-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: A2A selftest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent_team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_team/requirements.txt
      - name: Install pinned dependency ranges
        run: python -m pip install -r requirements.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q rdap.py team_agents
      - name: Authentication, relay, cancellation, and transport selftests
        run: python -m team_agents.selftest
