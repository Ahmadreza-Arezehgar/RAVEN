name: Raven A2A Agent Team

on:
  push:
    paths:
      - "agent_team/**"
      - "protocol/reference/**"
      - ".github/workflows/raven-agent-team.yml"
  pull_request:
    paths:
      - "agent_team/**"
      - "protocol/reference/**"
      - ".github/workflows/raven-agent-team.yml"
  workflow_dispatch:

concurrency:
  group: raven-agent-team-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    name: A2A selftest (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent_team
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent_team/requirements.lock.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q rdap.py team_agents
      - name: POSIX launcher smoke
        if: runner.os != 'Windows' && matrix.python == '3.10'
        run: bash ./rdap --help
      - name: Native Windows PowerShell 5.1 launcher smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: rdap.cmd --help
      - name: Native Windows PowerShell 7 launcher smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\rdap.ps1 --help
      - name: Authentication, relay, cancellation, and transport selftests
        run: python -m team_agents.selftest
