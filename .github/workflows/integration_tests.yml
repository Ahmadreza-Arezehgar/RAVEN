# Legacy Flutter/iOS workflow retained only as an explicit tombstone.
#
# The current repository no longer contains the Flutter project files this
# workflow used to test (`pubspec.yaml`, `integration_test/`, and `ios/`). Keep
# it manually dispatchable so GitHub shows why it is disabled, but do not run a
# misleading green/partially-swallowed test suite on pushes or pull requests.
name: Legacy Flutter Integration Tests (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-flutter-disabled-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled:
    name: Flutter application removed from this tree
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain disabled legacy workflow
        shell: bash
        run: |
          set -euo pipefail
          echo "DISABLED: this repository's supported product is the Rust terminal/node implementation."
          echo "The Flutter pubspec, integration_test directory, and ios project expected by the old workflow are absent."
          echo "Use raven-serverless.yml and build-raven-windows.yml for current validation."
