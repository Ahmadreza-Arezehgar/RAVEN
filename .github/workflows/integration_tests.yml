# .github/workflows/integration_tests.yml
# CI workflow for running integration and golden tests

name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests with coverage
        run: flutter test --coverage --machine > test-results.json || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results.json
          retention-days: 14

  golden_tests:
    name: Golden (Visual) Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run golden tests
        run: flutter test test/golden/ --update-goldens=false

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          retention-days: 7

  integration_tests:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests
        id: integration
        run: |
          mkdir -p build/test-results
          flutter test integration_test/ \
            --dart-define=CI=true \
            --reporter=github \
            --machine > build/test-results/integration-results.json 2>&1 || echo "TESTS_FAILED=true" >> $GITHUB_ENV

      - name: Upload test results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: build/test-results/
          retention-days: 14

      - name: Upload failure logs
        if: failure() || env.TESTS_FAILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-failures
          path: |
            build/test-results/
            **/*.log
          retention-days: 7

      - name: Fail if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1

  ios_device_tests:
    name: iOS Simulator Tests
    runs-on: macos-latest
    needs: [unit_tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (Simulator)
        run: flutter build ios --simulator --debug

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Boot iPhone 15 simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          xcrun simctl boot "$DEVICE_ID" || true
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Run integration tests on simulator
        run: |
          flutter drive \
            --driver=test_driver/integration_driver.dart \
            --target=integration_test/app_test.dart \
            -d "$DEVICE_ID" || true

      - name: Capture screenshots directory
        if: always()
        run: mkdir -p build/screenshots

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: build/screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown "$DEVICE_ID" || true
