[workspace]
resolver = "2"
members = [
    "crates/raven-core",
    "crates/raven-node",
    "crates/raven-swarm",
    "crates/ash",
]
default-members = ["crates/raven-core", "crates/raven-node", "crates/raven-swarm", "crates/ash"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["RAVEN contributors"]

[workspace.dependencies]
raven-core = { path = "crates/raven-core" }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
bech32 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
ml-kem = { version = "0.3", features = ["hazmat"] }
rand_core = "0.6"
