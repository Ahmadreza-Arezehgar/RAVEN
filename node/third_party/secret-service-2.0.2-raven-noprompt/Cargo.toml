[package]
authors = ["Walther Chen <walther.chen@gmail.com>"]
description = "RAVEN-pinned fork of secret-service 2.0.2 with DH no-prompt APIs (lab Task 0B.3 R0)"
documentation = "https://docs.rs/secret-service"
homepage = "https://github.com/hwchen/secret-service-rs.git"
keywords = ["secret-service", "password", "linux", "keychain"]
license = "MIT OR Apache-2.0"
name = "secret-service"
repository = "https://github.com/hwchen/secret-service-rs.git"
edition = "2018"
version = "2.0.2"

[dependencies]
aes = "0.7.0"
block-modes = "0.8.0"
hkdf = "0.11.0"
lazy_static = "1.4.0"
num = "0.4.0"
num-bigint-dig = { version = "0.9.1", features = ["zeroize"] }
rand = "0.8.1"
serde = { version = "1.0.118", features = ["derive"] }
sha2 = "0.9.2"
zbus = "1.9.2"
zbus_macros = "1.7.0"
zvariant = "2.4.0"
zvariant_derive = "2.4.0"
zeroize = "1"

[dev-dependencies]
zeroize = "1"

[features]
# Test-only tripwire: any legacy Prompt.Prompt execution aborts the R0 gate.
raven-r0-test-instrumentation = []

[lints.rust]
# Upstream 2.0.2 proxy signatures intentionally retain their published form.
mismatched_lifetime_syntaxes = "allow"

[lints.clippy]
# Preserve unmodified upstream 2.0.2 source outside the approved Raven delta.
get_first = "allow"
useless_conversion = "allow"
