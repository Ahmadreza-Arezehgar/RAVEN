[package]
name = "ash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RAVEN terminal CLI (product name ash) — local node control"

[[bin]]
name = "ash"
path = "src/bin/ash.rs"

[[bin]]
name = "raven"
path = "src/bin/raven.rs"

[features]
default = []
# Explicit lab opt-in for the publicly-derivable pre-ATSAM demo cipher.
unsafe-demo-crypto = ["raven-core/unsafe-demo-crypto"]
# Local TRACE_* file logging only (requires RAVEN_TRACE_LOG). No ingest/curl.
# Forbidden in Release: compile_error! with exact diagnostic in trace_delivery.rs.
debug-trace-delivery = []

[dependencies]
raven-core = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
