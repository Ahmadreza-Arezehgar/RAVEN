[package]
name = "raven-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RAVEN V1 protocol core — identity, address, envelope, queue, sealed payload"

[dependencies]
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
chacha20poly1305 = { workspace = true }
bech32 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }
ml-kem = { workspace = true, features = ["zeroize"] }
rand_core = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

# Secret Service needs libdbus — glibc desktop only (not musl static releases).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
secret-service = "2.0"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
test-helpers = []
# Lab-only compatibility for the pre-ATSAM demo cipher.  This construction
# derives its key from public identity material and therefore provides no
# confidentiality.  Production/default builds must never enable it.
unsafe-demo-crypto = []
