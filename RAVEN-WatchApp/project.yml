name: RAVEN-Watch
options:
  bundleIdPrefix: app.raven.watchos
  deploymentTarget:
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    PRODUCT_NAME: RAVEN
    # Watch bundle id MUST start with the parent iPhone's bundle id
    # (`app.raven.ios`) followed by a dot — Watch installation fails
    # otherwise with "bundle identifier does not start with its parent
    # app's bundle identifier".
    PRODUCT_BUNDLE_IDENTIFIER: app.raven.ios.watchkitapp
    WATCHOS_DEPLOYMENT_TARGET: "10.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "86L46Z294A"
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_FILE: RAVEN-Watch/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: RAVEN-Watch/Resources/RAVEN-Watch.entitlements
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    OTHER_SWIFT_FLAGS: "-warn-concurrency -enable-actor-data-race-checks"
    TARGETED_DEVICE_FAMILY: "4"
    SDKROOT: watchos
    SUPPORTS_MACCATALYST: "NO"

targets:
  RAVEN-Watch:
    type: application
    platform: watchOS
    sources:
      - RAVEN-Watch/RAVENWatchApp.swift
      - RAVEN-Watch/Models
      - RAVEN-Watch/Services
      - RAVEN-Watch/Views
      - RAVEN-Watch/Resources/Assets.xcassets
    info:
      path: RAVEN-Watch/Resources/Info.plist
      properties:
        CFBundleDisplayName: RAVEN
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: "© 2026 ASH Robotic Industry. All rights reserved."
        # Used the first time the user taps the "Voice" reply button in
        # compose. We record locally with AVAudioRecorder and ship the
        # M4A via WCSession.transferFile to the paired iPhone, which
        # turns it into a normal voice message via the regular outbox.
        NSMicrophoneUsageDescription: "RAVEN uses the microphone for voice replies and push-to-talk in audio rooms."
        # Permits the standalone-LTE fallback (Series 4+) when the paired
        # iPhone is unreachable. The Watch hits the same REST API the
        # phone uses, with the auth token stored in the Watch's Keychain.
        NSLocalNetworkUsageDescription: "RAVEN uses the local network for low-latency communication with the paired iPhone."
        # WCSession identifier — must match the iPhone-side bundle so
        # `WCSession.default` pairs correctly on both ends.
        WKCompanionAppBundleIdentifier: "app.raven.ios"
        WKApplication: true
        # Watch-only "always on" tab style we use in RootView.
        WKSupportsLiveActivities: true
        UIBackgroundModes:
          # Audio session for PTT in rooms + voice-message recording.
          - audio
    entitlements:
      path: RAVEN-Watch/Resources/RAVEN-Watch.entitlements
      properties:
        # App Groups so the Watch and iPhone share the auth token used by
        # the standalone-LTE fallback. The group id matches the iOS app.
        com.apple.security.application-groups:
          - group.app.raven.shared
        # Outbound HTTPS for the standalone-LTE fallback.
        com.apple.security.network.client: true
