org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# AGP + the Kotlin DSL bundled with Gradle 8.14 can't parse JDK 25's
# version string. Pin the Gradle daemon to the local JDK 17 install
# while we wait for upstream to catch up. Anyone cloning this repo
# without /opt/homebrew/opt/openjdk@17 should either install it via
# `brew install openjdk@17` or comment this line out and let Android
# Studio set its bundled JDK 17 via Project Structure → SDK Location.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g

# Disable when we hit an issue; on for normal builds.
kotlin.compiler.execution.strategy=in-process

# Compose compiler metrics — useful for perf tracking later.
# Uncomment to dump composables compilation reports:
# raven.composeCompilerMetrics=true
# raven.composeCompilerReports=true
